on:
  pull_request:

concurrency:
  group: rtdworkflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rtd-docs-checks:
    uses: canonical/operator-workflows/.github/workflows/docs_rtd.yaml@df449f1e3d1b8babbe9df48bbebcff1e58c9fda9
    secrets: inherit
    with:
      python-version: '3.12'
      enable-sphinx-python-dependency-build-checks: false
